<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>niixtube settings</title>
<link rel="stylesheet" href="options.css" />
</head>
<body>
<main>
  <h1>niixtube settings</h1>
  <form id="settingsForm">
    <label class="toggle-row">
      <span>
        <strong>Subscriptions-only home</strong>
        <small>Redirects the home page to your subscriptions feed, newest upload first.</small>
      </span>
      <input type="checkbox" id="subscriptionsOnlyHome" name="subscriptionsOnlyHome" />
    </label>

    <label class="toggle-row">
      <span>
        <strong>Grey out watched videos</strong>
        <small>Fully watched videos stay visible but are dimmed and desaturated.</small>
      </span>
      <input type="checkbox" id="greyOutWatched" name="greyOutWatched" />
    </label>

    <label class="toggle-row">
      <span>
        <strong>"Watched" badge</strong>
        <small>Adds a small "Watched" label over the thumbnail of fully watched videos.</small>
      </span>
      <input type="checkbox" id="watchedBadge" name="watchedBadge" />
    </label>

    <label class="toggle-row">
      <span>
        <strong>Watched threshold</strong>
        <small>Percentage of a video's progress bar that counts as "fully watched".</small>
      </span>
      <input type="number" id="watchedThreshold" name="watchedThreshold" min="50" max="100" step="1" />
    </label>

    <label class="toggle-row">
      <span>
        <strong>Hide YouTube Shorts</strong>
        <small>Removes Shorts shelves, the Shorts tab, and redirects /shorts links to normal watch pages.</small>
      </span>
      <input type="checkbox" id="hideShorts" name="hideShorts" />
    </label>

    <label class="toggle-row">
      <span>
        <strong>Enqueue &amp; auto-play-next</strong>
        <small>Adds +Q buttons to videos and automatically plays the next queued video when one ends.</small>
      </span>
      <input type="checkbox" id="enqueueEnabled" name="enqueueEnabled" />
    </label>

    <label class="toggle-row">
      <span>
        <strong>Seamless continue watching</strong>
        <small>Auto-dismisses the "Video paused. Continue watching?" popup.</small>
      </span>
      <input type="checkbox" id="autoContinueWatching" name="autoContinueWatching" />
    </label>
  </form>
  <p id="savedMsg" class="saved-msg">Saved</p>
</main>
<script src="../lib/browser-polyfill.js"></script>
<script src="options.js"></script>
</body>
</html>
